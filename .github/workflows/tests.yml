name: tests
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Smoke-test inference benchmark
        run: python projects/inference_bench/bench.py --mode synthetic --requests 25 --concurrency 4 --seed 11
      - name: Smoke-test scheduler benchmark
        run: python projects/kodie_scheduler/benchmark.py --requests 50 --seed 7 --out /tmp/kodie-results
      - name: Run repository hygiene checker
        run: python projects/oss_contribution_kit/check_repo.py .
